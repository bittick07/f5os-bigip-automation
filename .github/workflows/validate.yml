name: Validate Ansible playbooks

on:
  push:
  pull_request:

jobs:
  syntax-check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Ansible
        run: python -m pip install ansible-core

      - name: Install required collections
        run: ansible-galaxy collection install -r requirements.yml -p ./collections

      - name: Check F5OS playbook syntax
        run: ansible-playbook --syntax-check playbooks/f5os_connectivity.yml

      - name: Check BIG-IP playbook syntax
        run: ansible-playbook --syntax-check playbooks/bigip_connectivity.yml

      - name: Check BIG-IP example syntax
        run: ansible-playbook --syntax-check playbooks/bigip_virtual_server_example.yml

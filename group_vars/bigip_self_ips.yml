---
# Credentials come from an AWX Machine credential or encrypted local vault.
ansible_connection: local

bigip_provider:
  server: "{{ ansible_host }}"
  user: "{{ ansible_user }}"
  password: "{{ ansible_password }}"
  validate_certs: true

# The key matches the AWX inventory host name, not its management IP.
# Replace YOUR_SELF_IP, YOUR_NETMASK, and YOUR_VLAN before running.
bigip_self_ips_by_host:
  f5-dev-dc01:
    - name: self_internal
      address: "YOUR_SELF_IP"
      netmask: "YOUR_NETMASK"
      vlan: "/Common/YOUR_VLAN"
      partition: Common
      allow_service:
        - none

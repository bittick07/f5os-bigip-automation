---
# Matches the connection settings in bigip_tenant_backup.yml.
# Credentials come from an AWX Machine credential or encrypted local vault.
ansible_connection: local

bigip_provider:
  server: "{{ ansible_host }}"
  user: "{{ ansible_user }}"
  password: "{{ ansible_password }}"
  validate_certs: true

# Keys must exactly match inventory_hostname in your existing f5 inventory.
# Each tenant has its own list to avoid assigning the same IP to multiple hosts.
# Replace the empty mapping with your real configuration before running.
bigip_self_ips_by_host: {}


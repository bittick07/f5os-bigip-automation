---
# Credentials come from an AWX Machine credential or an encrypted local vault file.
ansible_connection: local

# Prefix used by playbooks/bigip_tenant_backup.yml. UCS files are created in
# /var/local/ucs on each BIG-IP tenant and are not downloaded by this test job.
bigip_ucs_backup_prefix: awx-backup

bigip_provider:
  server: "{{ ansible_host }}"
  user: "{{ ansible_user }}"
  password: "{{ ansible_password }}"
  validate_certs: true
